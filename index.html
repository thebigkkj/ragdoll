<title>Quiver &amp; Flop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen canvas; your tower left, enemy slabs right. Start screen = upgrade column + arrow arsenal column over the right side. Single committed dark look. */
:root{
  --bg:#1e1a26; --panel:#2b2536; --line:#463c55; --ember:#ff7a3d; --bone:#f3e6c8; --blood:#e0485a; --stam:#6fb7ff; --gold:#f2c14e; --ink:#0d0916; --muted:#9a8ca8;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--bone);overflow:hidden}
#game{position:relative;height:100%;width:100%;user-select:none;-webkit-user-select:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;pointer-events:none;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.skulls{font-family:var(--display);font-size:clamp(22px,3.4vw,36px);line-height:1;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.skulls svg{width:1em;height:1em}
#killline{color:var(--muted);margin-top:6px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.meta b{color:var(--bone);font-variant-numeric:tabular-nums}
.meta span{color:var(--muted)}
.btns{display:flex;gap:8px;pointer-events:auto}
button{font:700 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:rgba(13,9,22,.6);color:var(--bone);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ember)}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#jump{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px 20px;font-size:14px;border-color:var(--stam);touch-action:none}
#jump small{display:block;color:var(--stam);font-size:10px;margin-top:2px}
#jump:disabled{opacity:.45}
#msg{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(36px,8vw,88px);color:var(--blood);text-shadow:0 4px 0 var(--ink);pointer-events:none;white-space:nowrap;text-align:center}
#sub{position:absolute;left:50%;top:calc(30% + clamp(34px,6vw,64px));transform:translateX(-50%);font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none;text-align:center;width:calc(100% - 32px)}

/* arrow slots */
/* arrow slots: sit on the tower under your archer */
#slots{position:absolute;display:flex;gap:6px;transform:translateX(-50%);z-index:3;--sz:58px}
.slot{position:relative;width:var(--sz);height:var(--sz);padding:3px 3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;background:rgba(13,9,22,.72);text-transform:none;touch-action:none}
.slot canvas{width:100%;flex:1;min-height:0;display:block}
.slot .k{position:absolute;top:2px;left:5px;font:700 10px var(--mono);color:var(--muted)}
.slot .lbl{font:400 10px var(--display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.empty .lbl{color:var(--muted)}
.slot.empty canvas{display:none}
.slot.empty::before{content:"+";font:400 22px var(--display);color:var(--muted);margin:auto}
.slot.locked{border-style:dashed;opacity:.75}
.slot.locked .lbl{color:var(--muted);display:flex;align-items:center;gap:3px}
.slot.locked .lbl svg{width:10px;height:10px}
.slot.on{border-color:var(--gold);background:#3a3045}
.slot.on .k{color:var(--gold)}
.slot.editing{border-color:var(--stam)}
#picker{box-sizing:border-box;position:absolute;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;width:min(380px,calc(100% - 32px));overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#picker[hidden]{display:none!important}
#picker .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
#picker h3{margin:0;font:400 16px var(--display);color:var(--gold)}
#picker .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 7px;text-transform:none;font:400 12px var(--display);letter-spacing:.02em;text-align:left}
.pick canvas{width:100%;height:20px;display:block}
.pick small{font:600 9px var(--mono);color:var(--stam);letter-spacing:.02em}
.pick.cur{border-color:var(--gold);background:#3a3045}
.pick .in{font:600 9px var(--mono);color:var(--gold)}
#picker .none{font:500 11px var(--mono);color:var(--muted)}

/* admin panel */
#admin{position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,9,22,.6);z-index:5;padding:16px}
#admin[hidden]{display:none!important}
#admin .box{background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:18px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;font-family:var(--mono)}
#admin h3{margin:0;font:400 20px var(--display);color:var(--gold);letter-spacing:.04em}
#admin .now{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
#admin .now b{color:var(--bone);font-variant-numeric:tabular-nums}
#admin .row{display:flex;gap:8px;flex-wrap:wrap}
#admin input{flex:1;min-width:0;font:500 15px var(--mono);background:var(--bg);color:var(--bone);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
#admin input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#admin .gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* start screen */
#menu{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:16px;bottom:16px;display:flex;gap:14px;align-items:flex-start;pointer-events:none;max-width:calc(100% - 32px)}
#menu[hidden]{display:none!important}
.col{display:flex;flex-direction:column;gap:8px;pointer-events:auto;overflow-y:auto;max-height:100%;min-width:0;padding-right:4px}
.col h2{font:400 14px var(--display);letter-spacing:.06em;margin:0 0 2px;color:var(--muted)}
.col h2 small{font:500 10px var(--mono);letter-spacing:.06em;margin-left:6px}
.up{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;text-transform:none}
.up .cost{display:flex;align-items:center;gap:6px;background:var(--bone);color:var(--ink);border-radius:6px;padding:7px 12px;font:400 17px var(--display);min-width:68px;justify-content:center}
.up .cost svg{width:16px;height:16px}
.up .name{font:400 clamp(13px,1.6vw,18px) var(--display);white-space:nowrap}
.up[data-k=armor] .name,.up[data-k=health] .name{color:var(--blood)}
.up[data-k=stamina] .name,.up[data-k=regen] .name{color:var(--stam)}
.up[data-k=pull] .name,.up[data-k=damage] .name,.up[data-k=slots] .name{color:var(--gold)}
.up .name small{display:block;font:500 10px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:2px}
.up:disabled{opacity:.45;cursor:not-allowed}
.up:hover:not(:disabled) .cost{background:var(--gold)}
.up.max .cost{background:var(--panel);color:var(--muted)}
.syn{display:flex;flex-direction:column;gap:1px;max-width:250px;font:500 10px var(--mono);color:var(--muted);letter-spacing:.02em;line-height:1.35}
.syn b{font:400 13px var(--display);color:var(--gold);letter-spacing:.03em}
.syn .rec{color:var(--bone)}
.arw{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;width:clamp(200px,22vw,250px);flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;text-transform:none;text-align:left}
.arw .n{font:400 15px var(--display)}
.arw .d{grid-column:1/-1;font:500 10px var(--mono);color:var(--muted);letter-spacing:.03em;line-height:1.35}
.arw canvas{grid-column:1/-1;width:100%;height:24px;display:block}
.arw .tag{font:700 11px var(--mono);letter-spacing:.06em;white-space:nowrap;display:flex;align-items:center;gap:4px}
.arw .tag svg{width:13px;height:13px}
.arw.sel{border-color:var(--gold);background:#3a3045}
.arw.sel .tag{color:var(--gold)}
.arw.locked .n{color:var(--muted)}
.arw.locked.cant .tag{color:var(--muted)}
@media (max-width:720px){
  #menu{top:calc(64px + env(safe-area-inset-top,0px));bottom:auto;left:16px;right:16px;max-height:34%;flex-direction:row;overflow-x:auto}
  .up .cost{font-size:14px;min-width:54px;padding:5px 8px}
  .arw{width:190px}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="sk" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.9 2 3 5.6 3 10.3c0 2.7 1.3 4.9 3.3 6.3V20a1 1 0 0 0 1 1h1.6v-2h1.6v2h3v-2h1.6v2h1.6a1 1 0 0 0 1-1v-3.4c2-1.4 3.3-3.6 3.3-6.3C21 5.6 17.1 2 12 2Zm-3.6 11.4a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4Zm7.2 0a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4Z"/></symbol></svg>

<div id="game">
  <canvas id="c" aria-label="Archery duel. Hold behind your archer to charge, release to shoot. Space to jump."></canvas>
  <div class="hud">
    <div>
      <div class="skulls"><svg><use href="#sk"/></svg><span id="skulls">0</span></div>
      <div id="killline"></div>
    </div>
    <div class="meta">
      <div class="btns"><button id="mute" type="button">Sound on</button><button id="reset" type="button">Quit run</button></div>
      <div><span>Best</span> <b id="best">0</b></div>
    </div>
  </div>
  <div id="menu">
    <div class="col" id="ups"><h2>Upgrades</h2></div>
    <div class="col" id="arws"><h2>Arrows <small id="owned"></small></h2></div>
  </div>
  <button id="jump" type="button">Jump<small>5 stamina</small></button>
  <div id="slots" aria-label="Arrow slots"></div>
  <div id="picker" hidden role="dialog" aria-labelledby="picker-title"></div>
  <div id="msg"></div>
  <div id="sub"></div>
  <div id="admin" hidden role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <div class="box">
      <h3 id="admin-title">Admin panel</h3>
      <div class="now">Skulls: <b id="admin-now">0</b></div>
      <div class="row"><button type="button" data-add="100">+100</button><button type="button" data-add="1000">+1,000</button><button type="button" data-add="10000">+10,000</button></div>
      <div class="row"><input id="admin-amt" type="number" inputmode="numeric" placeholder="Amount" aria-label="Skull amount"><button type="button" class="gold" id="admin-give">Give</button></div>
      <div class="row"><button type="button" id="admin-set">Set to amount</button><button type="button" id="admin-close">Close</button></div>
    </div>
  </div>
</div>

<script>
(()=>{
/* =====================================================================
   CONFIG — tweak the game here.
   ===================================================================== */
const CFG={
  world:{w:1200,h:760},
  gravity:0.16, arrowGravity:0.08,
  arrowMin:4, arrowMax:12.5,     // arrow speed at no / full draw
  pullRate:1/60,                 // how much the bow draws per frame (upgradeable). 1/60 = 1s from 0% to 100%
  drawCost:2,                    // default stamina per second of drawing (each arrow overrides with `sps`)
  holdDrain:2/60,                // basic arrow's drain per frame while holding at full pull; scales with the arrow's sps
  arrowLength:64, arrowStick:0.5,// arrows stick if they hit a surface steeper than this (0..1), else they bounce
  jumpCost:5, jumpPower:6.4,
  stiffness:0.14,      // how hard bodies hold their standing shape (0..1). Lower = looser, wobblier
  uprightForce:0.035,  // how fast a standing body rights itself while its feet touch something
  friction:0.55,       // how much a foot keeps sliding on a platform each frame (lower = grippier)
  knockback:0.035,     // how much of an arrow's speed pushes the whole body
  playerMass:2,        // you're harder to shove off your tower than enemies are off their slabs
  baseHP:100, baseStamina:100, staminaRegen:1/108,            // 1 stamina every 1.8s

  dmgToEnemy:{head:100,torso:50,arm:30,leg:30},
  dmgToPlayer:{head:26,torso:15,arm:7,leg:9},
  enemyFireRate:[380,170], enemyDrawTime:80, enemyAimError:1.8,
  // beginner grace: enemy hits start at this share of full damage and ramp to 100% as you rack up kills / threat
  rookieDmg:.55, rookieKills:50,
  skullMult:2,
  /* SYNERGIES — shown in the shop. The rules live in synergies() / explode() / the twister code.
     When you add an arrow, check this list and add any combos it should be part of */
  synergies:[
    {name:'THERMAL SHOCK', recipe:'Fire/Ember/Molotov + Frost/Snowball', desc:'Hot meets cold: 45 bonus damage, clears both'},
    {name:'TOXIC BLAZE',   recipe:'Fire + Poison',                desc:'The poison ignites: a blast that sets everyone nearby burning'},
    {name:'SUPERCONDUCT',  recipe:'Electro/Storm + Frost',        desc:'Ice conducts: 35 bonus damage and a long stun'},
    {name:'SHATTER',       recipe:'Frost + Mace/Bonk/Cannonball', desc:'Frozen solid, then smashed: 40 bonus damage'},
    {name:'YEET',          recipe:'Banana + Spring/Bonk/Mace/Heavy hit', desc:'Nothing to grip: they go flying'},
    {name:'POP',           recipe:'Balloon + Fire',               desc:'Pops every balloon and drops them'},
    {name:'FIRENADO',      recipe:'Fire + Tornado',               desc:'The twister burns everyone it catches'},
    {name:'SINGULARITY',   recipe:'Black Hole/Implosion + any explosive', desc:'Blast inside a gravity well: 60% bigger, 35% stronger'},
    {name:'BLOODLETTING',  recipe:'Barbed + Vampire',             desc:'Bonus damage per bleed stack, and you drink more of it'},
    {name:'MIND BREAK',    recipe:'Disco + Feather',              desc:'Confused and tickled: a 5s stun'},
    {name:'LIGHTNING ROD', recipe:'Flare + Electro',              desc:'The mark draws current: chain jumps to 2 extra enemies'},
    {name:'SENSORY OVERLOAD',recipe:'Watermelon + Disco',         desc:'Blinded and confused: a 4s stun'},
    {name:'CHAIN GANG',    recipe:'Lasso + Electro/Storm',        desc:'The shock runs down the rope and stuns the other one too'},
    {name:'IDENTITY CRISIS',recipe:'Participation Trophy + Disco', desc:'Confused and handed a trophy, they think they\'re on your team for 5s'},
    {name:'NO U',          recipe:'UNO Reverse + Sticky/Ember',   desc:'Their jammed bow backfires right now: 40 damage and they catch fire'},
    {name:'DRAMATIC MONOLOGUE',recipe:'Main Character + Electro/Feather (any stun)',desc:'They stay frozen through your whole 6s speech'},
    {name:'TAX FRAUD',     recipe:'IRS Audit + Flare',            desc:'Marked targets get audited harder: 60% instead of 30%'},
    {name:'AIR SUPERIORITY',recipe:'Bald Eagle + Balloon',        desc:'The balloons help: the eagle can carry off even a boss'},
    {name:'OUTBREAK',      recipe:'Rabies + Contagion',           desc:'Contagion spreads the rabies: now several of them are feral'},
    {name:'FLASH FREEZE',  recipe:'KS-2000 + Frost',              desc:'Charges that go off next to frozen targets shatter them for 30 extra damage'},
    {name:'WANTED',        recipe:'Outlaw + Flare',               desc:'Finishing off a marked enemy with the Outlaw collects a bounty: 10 bonus skulls'},
    {name:'PAPERWEIGHT',   recipe:'Super Light Arrow + Balloon',  desc:'Hitting someone floating on balloons pops them all and pins them straight back down for double damage'},
    {name:'INSTANT SPIN',  recipe:'W2000 + Awakening',            desc:'Awakened, the W2000 skips the 2-second windup and fires the moment you hold'},
    {name:'BULLET HELL',   recipe:'Explo2000 + Awakening',        desc:'While awakened the Explo2000 fires twice as fast: up to 150 explosive rounds a second'},
    {name:'PRICE TAG',     recipe:'Sniper3000 + Flare',   desc:'Marked targets take double from the lance, and their detonation is twice the size'},
    {name:'HOME RUN',      recipe:'Ultrabonk + Balloon',          desc:'Bonking someone already floating knocks them out of the park for bonus skulls'},
    {name:'TARGETED BARRAGE',recipe:'Hwacha + Flare',             desc:'With a marked enemy on screen, the whole barrage bends toward the marks'},
    {name:'DOMAIN CLASH',  recipe:'Open a domain while one is open',desc:'The new domain overpowers the old one and lasts 50% longer'},
    {name:'CRIMSON GARDEN',recipe:'Blade Garden + Barbed',        desc:'Bleeding enemies inside get cut twice as often'},
    {name:'FROZEN LAKE',   recipe:'Still Lake + Frost',           desc:'Frozen enemies inside take triple damage instead of double'},
    {name:'INFINITE REFLECTION',recipe:'Hall of Mirrors + Shadow Clones',desc:'Opened while your clones are out: arrows split into 6'},
    {name:'ZENITH',        recipe:'Solar Throne + Sunfall',       desc:'A Sunfall orb inside the throne grows twice as fast'},
    {name:'FULL POWER',    recipe:'Spirit Cannon + Awakening',    desc:'The beam does double damage while you\'re awakened'},
    {name:'SLEEPER AGENT', recipe:'Dominate + Ghost',             desc:'Dominating a possessed enemy: their weapon hits twice as hard'},
    {name:'FREEFALL',      recipe:'Graviton + Banana',            desc:'Slipping enemies fall twice as fast in whatever direction you pick'},
    {name:'DÉJÀ VU',       recipe:'Time Loop during Chronostasis', desc:'The loop replays three times instead of two'},
    {name:'DESYNC',        recipe:'Rewind + Wi-Fi Lag',           desc:'Lagging enemies get torn apart by the rewind: 50 damage each'},
    {name:'MOONLIGHT EXECUTION',recipe:'Crescent Moon + any stun', desc:'The crescent cuts stunned enemies for double'},
    {name:'AERIAL RAVE',   recipe:'Phantom Rush + Balloon',       desc:'Juggling someone already floating: the final spike hits twice as hard'},
    {name:'VOID TEAR',     recipe:'Rift + Black Hole/Implosion',  desc:'A rift near a gravity well shreds 3× harder'},
    {name:'TIME SKIP',     recipe:'Iaido during Chronostasis',    desc:'The cuts land in stopped time, so they come back doubled'},
    {name:'TOXIC BOND',    recipe:'Soul Chain + Poison',          desc:'The poison travels down the chain: every chained enemy is poisoned too'},
    {name:'MAIN CHARACTER MOMENT',recipe:'Perfect Parry + Main Character',desc:'Parries during plot armor send arrows back at 8× instead of 5×'},
    {name:'LIMIT BREAK',   recipe:'Awakening + Overcharge',       desc:'Overcharge builds twice as fast while you\'re awakened'},
    {name:'SUPERNOVA',     recipe:'Sunfall + Magnetar',           desc:'A Sunfall that goes off while a Magnetar is active detonates at double damage'},
    {name:'RING OF FIRE',  recipe:'Halo + Fire (target burning)', desc:'The blades are on fire: everything they touch or launch at burns'},
    {name:'SPAGHETTIFIED', recipe:'Wormhole + Flare',             desc:'Arrows that come out of the portal on a marked target do +50% damage'},
    {name:'SMOKE AND MIRRORS',recipe:'Shadow Clones + Watermelon', desc:'Cast on a blinded target, you get 6 clones instead of 4'},
    {name:'SOLID GOLD',    recipe:'Midas Touch + Golden',         desc:'Shattering a statue with a Golden arrow pays out triple'},
    {name:'PAPERCUTS',     recipe:'Thousand Cuts + Barbed',       desc:'Bleeding enemies get barbed blades: every one that sticks adds a bleed stack'},
    {name:'FLAIL',         recipe:'Telekinesis + Lasso',          desc:'Swing the roped partner around like a flail on a chain'},
    {name:'IRON MAIDEN',   recipe:'Magnetar + Frost',             desc:'A frozen target turns every incoming arrow into a double-damage spike'},
    {name:'DOUBLE AGENT',  recipe:'Marionette + Ghost',           desc:'A possessed puppet fires twice for every shot you take'},
    {name:'DEAD WEIGHT',   recipe:'Domino + Lasso',               desc:'Whoever is roped to the target goes down instantly too'},
    {name:'FIRESTORM',     recipe:'Hypercane + Fire (target burning)',desc:'The hypercane is on fire and burns everyone it carries'},
    {name:'PARADOX',       recipe:'Chronostasis + Time Dilation', desc:'Stopping time inside a time bubble: stored damage lands at 5×'},
    {name:'PLAGUE',        recipe:'Extinction Event + Poison',    desc:'A poisoned target takes a second species down with it'},
    {name:'REFUND',        recipe:'Recycler + Barbed',            desc:'+2 extra stamina back for every bleed stack on them'},
    {name:'BLINDSIDE',     recipe:'Headhunter + Watermelon',      desc:'Headshots on a blinded target do 3× instead of 2×'},
    {name:'BRITTLE',       recipe:'Crowbar + Frost/Snowball',     desc:'Frozen armor shatters: every piece comes off at once'},
    {name:'WRECKING BALL', recipe:'Momentum + Lasso',             desc:'Hitting a roped target hurls both ends of the rope'},
    {name:'DEATH WARRANT', recipe:'Guillotine + Flare',           desc:'Marked targets get executed under 35% (bosses 12%)'},
    {name:'OVERLOAD',      recipe:'Overcharge (2×+) + any stun',  desc:'A big overcharged hit on a stunned target blows up for 30 more'},
    {name:'PANDEMIC',      recipe:'Contagion + Poison',           desc:'A poisoned target infects EVERY enemy, not just 2'},
    {name:'CHAIN REACTION',recipe:'Catalyst on 4+ statuses',      desc:'The reaction explodes and hits everyone nearby'},
    {name:'HOT STREAK',    recipe:'Tempo + Flare',                desc:'Hits on marked targets add 2 to the streak'},
    {name:'SHARED FATE',   recipe:'Conduit + Lasso',              desc:'Copied effects also land on whoever is on the other end of the rope'},
    {name:'LUCKY NUMBERS', recipe:'Fortune Cookie + Flare',       desc:'A marked target cracks every fortune at once: stamina, health and a skull'},
    {name:'SURPRISE PARTY',recipe:'Pillow + Party Popper',        desc:'Waking them with a party popper does TRIPLE damage instead of double'},
    {name:'FELL FOR YOU',  recipe:'Rizz + Banana',                desc:'Slipping and in love: they overshoot, sail right over you and off the back of your tower'},
    {name:'PACKET LOSS',   recipe:'Wi-Fi Lag + Time Dilation',    desc:'Lagging inside a time bubble: lasts twice as long and every rubberband hurts'},
    {name:'INVISIBLE BOX', recipe:'Mime + Ricochet/Rubber Chicken',desc:'Your bouncing arrows bounce off the mime\'s wall too'},
    {name:'IMPOSTOR FOUND',recipe:'Emergency Meeting + Ghost',    desc:'The possessed one is always the one voted out'},
    {name:'OBSERVED',      recipe:'99.99% + Schrödinger',         desc:'A box that\'s already 99.99% dead always opens DEAD'},
    {name:'COMEBACK ARC',  recipe:'99.99% + Participation Trophy',desc:'Terrible idea: the trophy fully heals them and they fire faster'},
    {name:'TARGET PAINTED',recipe:'Rod From God + Flare',         desc:'The satellite drops 2 extra rods on the nearest enemies'},
  ],
  platformGrace:300, // frames (5s) an enemy can be off its own platform before it crumbles away   // every kill's skull reward is multiplied by this
  enemiesAt:[[0,1],[10,2],[25,3]],
  /* ENEMY TYPES — unlocked once you reach `from` kills; `w` = how often they show up.
     hp · color · sc (size) · arrow · rate/draw (fire interval & draw time ×) · err (aim error ×) · dmg (×)
     armor: list of armor piece names (see ARMOR) · shield · laser (sniper sight) · heal (patches up allies) · mass

/* ---------- menu ---------- */
function skullTag(n){return`<svg><use href="#sk"/></svg>${Number(n).toLocaleString()}`;}
function buildMenu(){
  const ups=$('ups'),arws=$('arws');

    const l=lv(k),max=l>=u.max,cost=u.base+l*u.step;
    const b=document.createElement('button');b.type='button';b.className='up'+(max?' max':'');b.dataset.k=k;b.id='up-'+k;
    b.innerHTML=`<span class="cost">${max?'MAX':skullTag(cost)}</span><span class="name">${u.label} +${l}${k==='armor'&&!max?`<small>next: ${ARMOR[l].name}</small>`:k==='slots'?`<small>${S.slots} of 3 slots</small>`:''}</span>`;
    b.disabled=max||save.skulls<cost;
    b.onclick=()=>{if(save.skulls<cost||max)return;save.skulls-=cost;save.lv[k]=l+1;persist();tone(500,900,.12,.15,'sine');resetWorld();buildMenu();renderSlots();updHud();};
    ups.appendChild(b);
  }
  // combo cheat sheet
  const sh=document.createElement('h2');sh.className='synh';sh.textContent='Synergies';sh.style.marginTop='10px';ups.appendChild(sh);
  for(const s of CFG.synergies){const d=document.createElement('div');d.className='syn';d.innerHTML=`<b>${s.name}</b><span class="rec">${s.recipe}</span><span>${s.desc}</span>`;ups.appendChild(d);}
  const list=Object.entries(CFG.arrows).filter(([,a])=>!a.hidden).sort(([,a],[,b])=>a.cost-b.cost||a.label.localeCompare(b.label)); // cheapest first
  const L=save.loadout;
  $('owned').textContent=list.filter(([k])=>save.owned[k]).length+' / '+list.length+' · '+L.length+'/'+S.slots+' equipped';
  for(const[k,a] of list){
    const own=!!save.owned[k],slot=L.indexOf(k);
    const b=document.createElement('button');b.type='button';b.id='arw-'+k;b.className='arw'+(slot>=0?' sel':'')+(own?'':' locked')+(!own&&save.skulls<a.cost?' cant':'');
    b.innerHTML=`<span class="n">${a.label}</span><span class="tag">${slot>=0?'Slot '+(slot+1):own?'Equip':skullTag(a.cost)}</span><span class="d">${a.desc} · <b style="color:var(--stam)">${a.sps||CFG.drawCost} stamina/s</b></span><canvas width="460" height="48" aria-hidden="true"></canvas>`;
    b.onclick=()=>{
      if(!own){if(save.skulls<a.cost){b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:180});return;}save.skulls-=a.cost;save.owned[k]=true;tone(500,900,.12,.15,'sine');}
      // equipped → unequip (keeps at least one); otherwise fill a free slot or swap out the last one
      const i=L.indexOf(k);

      else if(L.length<S.slots)L.push(k);else L[L.length-1]=k;

function wantEnemies(){let n=1;for(const[k,c] of CFG.enemiesAt)if(kills>=k)n=c;for(const t of CFG.threat.extraAt)if(threat>=t)n++;return Math.min(5,n);}
function spawnEnemy(force,child){
  // pick an enemy type from the ones unlocked so far (counters get likelier if you carry what they counter)
  let pool=Object.values(CFG.enemyTypes).filter(t=>(t.hard?kills:kills+threat*CFG.threat.unlock)>=t.from&&(!t.only||save.loadout.includes(t.only))),wt=t=>t.w*(t.counters&&t.counters.some(k=>save.loadout.includes(k))?4:1);
  {const pb=pool.filter(t=>!bannedTypes.has(t));if(pb.length)pool=pb;} // extinct species stay extinct
  let roll=Math.random()*pool.reduce((s,t)=>s+wt(t),0),T=pool[0];
  for(const t of pool){roll-=wt(t);if(roll<=0){T=t;break;}}
  if(force)T=force;
  // find a spot whose platforms (plus head room) don't overlap anything already there
  const clash=ps=>ps.some(q=>plats.some(o=>o.fade>0&&q.x<o.x+o.w+40&&q.x+q.w>o.x-40&&q.y-140<o.y+o.h&&q.y+q.h>o.y-140));
  let x,y,ps,stance,tries=0;
  do{
    x=720+Math.random()*360;y=250+Math.random()*300;tries++;
    // platform kinds, each with stances that fit it. Enemies face left, so their "front" foot is the left one.
    const kind=T.ballista?'ballista':['slab','slab','pillar','stilts','step'][Math.random()*5|0];
    if(kind==='slab'){const w=80+Math.random()*30;ps=[{x:x-w/2,y,w,h:26}];stance=['stand','wide','crouch'][Math.random()*3|0];}
    else if(kind==='pillar'){ps=[{x:x-30,y,w:60,h:H+200-y}];stance=Math.random()<.5?'stand':'crouch';}
    else if(kind==='stilts'){ps=[{x:x-30-14,y,w:28,h:28},{x:x+30-14,y,w:28,h:28}];stance='split';}
    else if(kind==='ballista'){x=Math.max(x,830);ps=[{x:x-110,y,w:170,h:26},{x:x-95,y:y-24,w:40,h:24}];stance='crouch';}
    else{ps=[{x:x-40,y:y-20,w:44,h:46},{x:x+4,y,w:46,h:26}];stance='step';}
  }while(tries<40&&clash(ps));
  if(clash(ps)){spawnT=40;return;} // no room right now — try again shortly
  const sc=T.sc||1,st=STANCES[stance],e=new Doll({x:x+(st.fx+st.bx)/2*sc,y},-1,T.color,Math.round((T.hp+Math.min(60,kills*2))*(1+threat*CFG.threat.hp)),stance,{sc,mass:T.mass||sc*sc});
  if(child){e.child=true;e.hp=e.maxHp=Math.max(30,Math.round(e.hp*.4));}
  e.type=T;e.arrow=T.arrow||'basic';e.mult=T.dmg||1;e.drawMul=T.draw||1;
  e.armor=(T.armor||[]).map(n=>ARMOR.find(A=>A.name===n)).filter(Boolean);if(T.shield)e.armor.push({name:'Shield',shield:true});
  if(T.mirror)e.armor.push({name:'Mirror',shield:true,mirror:true});
  if(T.tower)e.armor.push({name:'Tower shield',tower:true,hole:[.2,.54]}); // the gap you shoot through (share of the shield's height)
  if(T.ballista){e.bal={x:x-75,y:y-38,base:y-24,ang:Math.PI+(T.siege==='catapult'?.8:.15),load:0,swing:0,flash:0,kind:T.siege||'ballista'};e.aim=Math.PI+.4;}
  if(T!==CFG.enemyTypes.grunt)floats.push({x,y:y-130,text:T.name.toUpperCase(),life:90,col:T.color});
  for(const q of ps){q.fade=1;q.owner=e;plats.push(q);e.plats.push(q);}
  const lvl=Math.min(1,kills/35),[r0,r1]=CFG.enemyFireRate;
  const TH=CFG.threat;
  e.cd=120+Math.random()*100;e.err=(CFG.enemyAimError-lvl*.6)*(T.err||1)*Math.max(.35,1-threat*TH.aim);e.rate=Math.max(r1,r0-kills*4)*(T.rate||1)*Math.max(.45,1-threat*TH.rate);e.drawT=0;e.plan=null;e.rise=50;e.healT=240;
  for(const p of e.p){p.y-=40;p.oy-=40;p.py-=40;}

}

/* laser: no projectile at all. An instant beam straight out of the bow that cuts through
   bodies, armor, shields, platforms and enemy arrows, all the way off the screen */
function fireLaser(A){
  const P=player.p,ang=Math.atan2(P[4].y-P[3].y,P[4].x-P[3].x),c=Math.cos(ang),s=Math.sin(ang);
  const x0=P[4].x+c*10,y0=P[4].y+s*10,pw=.35+.65*player.pull,hit=new Set();let x1=x0,y1=y0,mirror=null;
  for(let t=0;t<1900;t+=4){
    const x=x0+c*t,y=y0+s*t;x1=x;y1=y;
    if(x<-60||x>W+60||y<-60||y>H+60)break;
    // the one thing a laser can't go through: a Mirror Knight's shield
    for(const e of enemies){if(!e.alive||e.fade<1||!e.type||!e.type.mirror)continue;const ar=e.armorHit(x,y,false);if(ar&&ar.mirror){mirror=e;break;}}
    if(mirror)break;
    for(const e of enemies){if(hit.has(e)||e.fade<1)continue;const h=e.hit(x,y);if(!h)continue;hit.add(e);
      bleedFx(x,y,c*8,s*8,8);puff(x,y,'#bff6f8',8,3,18,true);
      for(const p of e.p){p.ox-=c*2.5*pw/(e.mass||1);p.oy-=s*2.5*pw/(e.mass||1);}
      damageEnemy(e,CFG.dmgToEnemy[h.part]*S.dmg*(A.dmg||1)*pw,x,y,{head:h.part==='head'});}
    for(const b of arrows){if(b.owner===player||b.state!=='fly')continue;if(Math.hypot(b.x-x,b.y-y)<10){b.state='gone';puff(b.x,b.y,'#bff6f8',6,2,16,true);}}
    if(t%40===0&&platAt(x,y))parts.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:20,ember:true,col:'#bff6f8'});
  }
  fxs.push({kind:'laser',x1:x0,y1:y0,x2:x1,y2:y1,life:18,max:18});
  player.pull=0;impact(2);shake=Math.max(shake,6+6*pw);
  // bounced straight back at you, at double strength. Armor doesn't help: it's still a laser
  if(mirror){
    const n=player.p[1],dx=n.x-x1,dy=n.y-y1,l=Math.hypot(dx,dy)||1;
    fxs.push({kind:'laser',x1,y1,x2:n.x+dx/l*120,y2:n.y+dy/l*120,life:22,max:22,col:'255,90,122'});
    puff(x1,y1,'#ffffff',14,4,20,true);impact(5);shake=Math.max(shake,16);
    floats.push({x:x1,y:y1-34,text:'REFLECTED',life:70,col:'#ff5a7a',big:true});tone(3200,400,.4,.22,'sawtooth');
    if(mode==='play'&&player.alive){playerDamage(2*CFG.dmgToEnemy.torso*S.dmg*(A.dmg||1)*pw,n.x,n.y);player.stag=30;push(player,dx/l*-3,-1);}
  }
  tone(2600,180,.35,.2,'sawtooth');noise(.25,6000,.2);
  if(hit.size>=2)floats.push({x:(x0+x1)/2,y:(y0+y1)/2-30,text:hit.size+' IN A ROW',life:60,col:'#7fe0e6',big:true});
}

/* ---------- shooting ---------- */
function shoot(){
  const k=save.sel,A=DEF(k);
  if(A.laser){fireLaser(A);return true;}
  if(A.crescent){crescentWave();return true;}
  if(A.spirit){spiritBlast();return true;}
  if(A.hwacha){hwachaVolley();return true;}
  if(A.ks){if(ksReloadT>0)return false;ksBlast();return true;}
  if(A.outlaw){if(olSpin>0||olReload>0)return false;outlawShot();return true;}
  if(A.heavyA){const P=player.p,ba=Math.atan2(P[4].y-P[3].y,P[4].x-P[3].x);push(player,-Math.cos(ba)*2.2,0);shake=Math.max(shake,18);tone(50,25,.5,.45,'sine');noise(.3,400,.4);}
  if(A.w2k)return false; // the W2000 only fires while held
  // a quick tap on the Explo2000 fires a single explosive round, same as one shot of the spray
  if(A.explo){fire(player,player.aim+(Math.random()-.5)*(A.autoSpread||.05),(CFG.arrowMin+Math.max(.35,player.pull)*(CFG.arrowMax-CFG.arrowMin))*(A.autoSpeed||1),A.autoKind,{});lastExploShot=clock;
    const P=player.p,bang=Math.atan2(P[4].y-P[3].y,P[4].x-P[3].x),fx=Math.cos(bang),fy=Math.sin(bang),up=Math.cos(bang)<0?1:-1;
    parts.push({x:P[4].x+fx*8-fy*8*up,y:P[4].y+fy*8+fx*8*up,vx:-fx*1.5-fy*2*up,vy:-3,life:240,chunk:true,w:5,h:2.4,rot:bang,vr:.5,col:'#d9b24a'});return true;}
  if(A.annihilator){annihilate();return true;}
  if(A.ubonk){tone(70,35,.35,.4,'sine');noise(.2,400,.35);} // it's heavy just leaving the bow
  const sp=(CFG.arrowMin+player.pull*(CFG.arrowMax-CFG.arrowMin))*(A.speed||1),n=A.count||1;
  const made=[];for(let i=0;i<n;i++)made.push(fire(player,player.aim+(i-(n-1)/2)*(A.spread||.07),sp,k,{keepPull:i<n-1}));
  // quantum: the copies share one wavefunction until something observes them
  if(A.quantum){const wf={done:false};for(const m of made)m.wf=wf;}
  // twin: same direction, the second one rides 10px beside the first
  if(A.twin&&made[1]){const b=made[1],nx=-Math.sin(b.ang),ny=Math.cos(b.ang);b.x+=nx*10;b.y+=ny*10;}
  puppetShots(k,sp);
  clonesShoot(k,sp);
  if(A.over){const o=1+Math.min(2,(player.over||0)/75);for(const m of made)m.ovr=o;}
  if(A.over&&awakeT>0&&(player.over||0)>30)combo('LIMIT BREAK',player.p[0].x,player.p[0].y,'#fff0a8');
  player.over=0;
  if(A.echo){const ang=lastBow,spd=sp;later(18,()=>{if(player.alive)fire(player,ang,spd,'echolet',{raw:true});});}
  return true;
}
let lastBow=0;
function fire(d,ang,speed,kind,opt){
  opt=opt||{};
  // launch along the bow as drawn: direction = bow arm (elbow→hand), start = the nocked arrow's tip
  const P=d.p,bow=Math.atan2(P[4].y-P[3].y,P[4].x-P[3].x);
  let off=ang-d.aim;while(off>Math.PI)off-=2*Math.PI;while(off<-Math.PI)off+=2*Math.PI;
  if(Math.abs(off)>.3)off=0;
  const c=Math.cos(bow),s=Math.sin(bow),b=d.pull>0?P[6]:{x:P[4].x-c*10,y:P[4].y-s*10};
  if(!opt.raw)ang=bow+off;
  if(d===player)lastBow=bow;
  const D=DEF(kind);
  const tipL=D.look&&D.look.bare?14:CFG.arrowLength;
  const a={x:b.x+c*tipL,y:b.y+s*tipL,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,ang,owner:d,kind,D,state:'fly',trail:[],dodged:false,life:0,spin:0,
    bounces:D.bounce||0,pierced:0,hitSet:new Set(),mult:d.mult||1};
  if(stopT>0&&d===player)a.chronoMult=stopMult; // fired into stopped time: lands doubled once it resumes
  if(loopRec&&d===player&&!replaying)loopRec.recs.push({t:clock-loopRec.start,x:a.x,y:a.y,vx:a.vx,vy:a.vy,kind}); // time loop is recording
  arrows.push(a);if(arrows.length>(D.xr||D.hv?450:90))arrows.shift(); // the Explo2000 gets a much bigger cap
  if(!opt.keepPull)d.pull=0;
  tone(d===player?340:240,95,.12,d===player?.16:.08);
  return a;
}
function impulse(a,d,h,kb){
  const m=d.mass||1,s=(h.part==='head'?.3:.22)*kb/m,ids=h.part==='head'?[0,1]:[h.a,h.b];
  for(const i of ids){d.p[i].ox-=a.vx*s;d.p[i].oy-=a.vy*s;}
  const kbb=CFG.knockback*kb/m;for(const p of d.p){p.ox-=a.vx*kbb;p.oy-=a.vy*kbb*.5;}
}
function attach(a,d,h){
  const tx=a.x+Math.cos(a.ang)*12,ty=a.y+Math.sin(a.ang)*12,F=frame2(d,h.a,h.b),rx=tx-F.A.x,ry=ty-F.A.y;

function makeLoose(a,av){const L=a.D.len??CFG.arrowLength;a.state='loose';a.av=av||0;a.age=0;a.cx=a.x-Math.cos(a.ang)*L/2;a.cy=a.y-Math.sin(a.ang)*L/2;a.touch=0;}

    case 'chicken':g.beginPath();g.ellipse(2,0,9,6,0,0,7);g.fill();g.beginPath();g.arc(9,-4,4.5,0,7);g.fill();g.fillStyle='#ff8a3a';g.beginPath();g.moveTo(13,-4);g.lineTo(18,-3);g.lineTo(13,-1);g.fill();g.fillStyle='#e0485a';g.beginPath();g.arc(9,-9,2,0,7);g.fill();g.fillStyle='#0d0916';g.beginPath();g.arc(10,-5,1,0,7);g.fill();break;
    case 'banana':g.strokeStyle=lk.hc;g.lineWidth=5;g.lineCap='round';g.beginPath();g.arc(-2,8,12,-1.9,-.25);g.stroke();g.strokeStyle='#5a3a1c';g.lineWidth=2;g.beginPath();g.moveTo(9,4);g.lineTo(11,2);g.stroke();break;
    case 'boom':g.save();g.rotate(spin||0);g.lineWidth=5;g.lineCap='round';g.strokeStyle=lk.hc;g.beginPath();g.moveTo(-10,-9);g.lineTo(0,0);g.lineTo(-10,9);g.stroke();g.restore();break;
    case 'spring':g.strokeStyle=lk.hc;g.lineWidth=2;g.beginPath();g.moveTo(-14,0);for(let i=0;i<6;i++)g.lineTo(-12+i*3,i%2?-5:5);g.lineTo(6,0);g.stroke();g.fillRect(5,-6,4,12);break;
    case 'disco':g.beginPath();g.arc(3,0,8,0,7);g.fill();for(let i=0;i<6;i++){g.fillStyle=['#c08aff','#6fb7ff','#f2c14e','#ff5a7a','#9be37a','#ffffff'][(i+(clock/8|0))%6];g.fillRect(-2+(i%3)*4,-5+(i/3|0)*5,3,3);}break;
    case 'swirl':g.strokeStyle=lk.hc;g.lineWidth=2.2;g.beginPath();for(let t=0;t<12;t+=.4){const rr_=t*.75;g.lineTo(2+Math.cos(t+(spin||0))*rr_,Math.sin(t+(spin||0))*rr_);}g.stroke();break;
    case 'boulder':g.save();g.rotate(clock*.05-ang);g.fillStyle='#7a6a58';g.beginPath();for(let i=0;i<9;i++){const t=i/9*6.28,rr_=12+((i*37)%5);g.lineTo(Math.cos(t)*rr_,Math.sin(t)*rr_);}g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(-4,-4,4,0,7);g.fill();g.restore();break;
    case 'feather':g.beginPath();g.moveTo(12,0);g.quadraticCurveTo(0,-9,-10,-2);g.quadraticCurveTo(0,9,12,0);g.fill();g.strokeStyle='#c9b8a0';g.lineWidth=1;g.beginPath();g.moveTo(-10,0);g.lineTo(12,0);g.stroke();break;
    case 'snow':g.beginPath();g.arc(0,0,9,0,7);g.fill();g.fillStyle='rgba(160,190,230,.6)';g.beginPath();g.arc(2,3,4,0,7);g.fill();break;
    case 'melon':g.beginPath();g.ellipse(0,0,14,11,0,0,7);g.fill();g.strokeStyle='#2a5a26';g.lineWidth=2;for(let i=-1;i<=1;i++){g.beginPath();g.ellipse(0,i*3,13,4,0,0,Math.PI);g.stroke();}break;
    case 'popper':g.beginPath();g.moveTo(10,-6);g.lineTo(-6,0);g.lineTo(10,6);g.closePath();g.fill();g.fillStyle='#ff5a7a';g.fillRect(-1,-3,3,6);g.fillStyle='#6fb7ff';g.fillRect(4,-4,2,8);break;
    case 'plunger':g.beginPath();g.moveTo(-2,0);g.quadraticCurveTo(4,-11,12,-10);g.lineTo(12,10);g.quadraticCurveTo(4,11,-2,0);g.fill();break;
    case 'gift':g.fillRect(-6,-7,14,14);g.fillStyle='#f2c14e';g.fillRect(0,-7,3,14);g.fillRect(-6,-1.5,14,3);g.beginPath();g.arc(-2,-9,3,0,7);g.arc(5,-9,3,0,7);g.fill();break;
    case 'hive':g.beginPath();g.ellipse(2,0,9,10,0,0,7);g.fill();g.strokeStyle='#8a5a20';g.lineWidth=1.5;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(-6,i*3.5);g.lineTo(10,i*3.5);g.stroke();}g.fillStyle='#2a1a0a';g.beginPath();g.arc(2,3,2,0,7);g.fill();break;
    case 'bee':g.fillStyle='#f2c14e';g.beginPath();g.ellipse(0,0,6,4.5,0,0,7);g.fill();g.fillStyle='#1a1a1a';g.fillRect(-2,-4,2,8);g.fillRect(2,-4,1.6,8);g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.ellipse(-1,-6,3,2,-.4,0,7);g.fill();break;
    case 'bottle':g.beginPath();g.ellipse(-1,0,8,6,0,0,7);g.fill();g.fillRect(5,-2,7,4);g.fillStyle='#ff8a3a';g.beginPath();g.arc(13,0,3+Math.sin(clock*.5),0,7);g.fill();break;
    case 'anvilhead':g.fillRect(-6,-7,12,4);g.fillRect(-3,-3,6,6);g.fillRect(-7,3,14,4);g.beginPath();g.moveTo(6,-7);g.lineTo(13,-7);g.lineTo(6,-3);g.fill();break;
    case 'anvil':g.save();g.rotate(-ang);g.fillStyle='#5a5a64';g.fillRect(-18,-14,30,9);g.beginPath();g.moveTo(12,-14);g.lineTo(24,-14);g.lineTo(12,-6);g.fill();g.fillRect(-10,-5,14,10);g.fillRect(-16,5,26,8);g.fillStyle='rgba(255,255,255,.15)';g.fillRect(-18,-14,30,2);g.restore();break;for(let i=0;i<6;i++){const t=i/6*6.28+clock*.3;g.fillRect(Math.cos(t)*6-1,Math.sin(t)*6-1,2.5,2.5);}g.fillStyle='#fff3c4';g.beginPath();g.arc(0,0,3,0,7);g.fill();break;
  }
  g.restore();
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();}

/* ---------- loop (fixed 60/s physics, interpolated drawing) ---------- */
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;let n=0;
  if(slowT>0){slowT-=dt;acc+=dt*.3;}else acc+=dt;
  // a bug in one frame should never freeze the whole game
  while(acc>=1/60&&n<5){try{step();}catch(err){console.error(err);}acc-=1/60;n++;}if(n>=5)acc=0;AL=Math.min(1,acc*60);
  if(impactT>0)impactT--;
  try{render();}catch(err){console.error(err);}
  requestAnimationFrame(loop);
}
toMenu();requestAnimationFrame(loop);
})();
